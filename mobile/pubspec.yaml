name: mobile
description: "WACRM Flutter Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  google_fonts: ^9.0.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  shared_preferences_android: 2.4.1
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mascot/
    - assets/pingo_character/
