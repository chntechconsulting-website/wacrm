name: Ops - Inspect Lead 268

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -eu
            echo "HOSTNAME=$(hostname)"
            id
            if sudo -n true 2>/dev/null; then echo "SUDO_OK"; else echo "SUDO_NO"; fi
            echo "APP_CANDIDATES:"
            sudo find /home /var/www /opt /srv /root -maxdepth 6 -type f -path '*/backend/main.py' 2>/dev/null | head -n 10 || true
            echo "SERVICES:"
            systemctl list-units --type=service --all 2>/dev/null | grep -iE 'wacrm|wa-crm|crm' | head -n 20 || true
