name: Diagnose PDF generation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Reproduce purchase PDF generation
    runs-on: ubuntu-latest
    steps:
      - name: Call temporary local diagnostic endpoint
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set +e
            TOKEN=$(openssl rand -hex 24)
            printf '%s' "$TOKEN" > /tmp/wacrm_pdf_diag_token
            chmod 600 /tmp/wacrm_pdf_diag_token
            echo "=== diagnostic response ==="
            curl -sS --max-time 120 -H "X-Diag-Token: $TOKEN" \
              http://127.0.0.1:8000/api/integrations/waquote/__pdf_diag
            echo
            echo "=== done ==="
            rm -f /tmp/wacrm_pdf_diag_token
