name: Diagnose PDF generation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Collect deployment details
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set +e
            echo "=== whoami ==="
            id
            echo "=== deploy script permissions ==="
            ls -l /usr/local/sbin/wacrm-deploy
            echo "=== deploy script ==="
            sed -n '1,260p' /usr/local/sbin/wacrm-deploy
            echo "=== sudo permissions ==="
            sudo -n -l
            echo "=== backend service ==="
            systemctl cat wacrm-backend
            echo "=== backend files ==="
            ls -la /opt/wacrm/backend | head -40
            echo "=== env permissions ==="
            ls -l /opt/wacrm/backend/.env
            getfacl /opt/wacrm/backend/.env 2>/dev/null
            echo "=== done ==="
