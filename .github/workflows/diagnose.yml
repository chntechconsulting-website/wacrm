name: Diagnose PDF generation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Reproduce purchase PDF generation
    runs-on: ubuntu-latest
    steps:
      - name: Run targeted PDF checks on production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set +e
            echo "=== service discovery ==="
            systemctl list-units --type=service --no-pager 2>/dev/null | grep -iE 'wacrm|uvicorn|gunicorn' | head -10
            SERVICE=$(systemctl list-units --type=service --no-pager 2>/dev/null | grep -iE 'wacrm|uvicorn|gunicorn' | awk '{print $1}' | head -1)
            echo "service=$SERVICE"
            echo "=== process discovery ==="
            ps aux 2>/dev/null | grep -iE 'uvicorn|gunicorn|main.py' | grep -v grep | head -10
            echo "=== docker discovery ==="
            docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null | head -10
            echo "=== filesystem discovery ==="
            for d in /var/www /opt /srv /home; do
              find "$d" -maxdepth 3 -type d -name backend 2>/dev/null | head -10
            done
            if [ -n "$SERVICE" ]; then
              WORKDIR=$(systemctl show -p WorkingDirectory --value "$SERVICE")
              if [ -z "$WORKDIR" ] || [ "$WORKDIR" = "/" ]; then
                PID=$(systemctl show -p MainPID --value "$SERVICE")
                WORKDIR=$(readlink -f "/proc/$PID/cwd")
              fi
              echo "service_workdir=$WORKDIR"
              if [ -n "$WORKDIR" ] && [ -d "$WORKDIR" ]; then
                echo "=== running targeted reproduction ==="
                cd "$WORKDIR"
                PY="$WORKDIR/venv/bin/python"
                [ -x "$PY" ] || PY=$(command -v python3)
                echo "python=$PY"
                "$PY" - <<'PY'
            import os
            import sys
            import traceback

            sys.path.insert(0, os.getcwd())
            from database import SessionLocal
            from models.quotation import Quotation
            from models.user import User
            from integrations.waquote.router import (
                download_quotation_pdf,
                download_proforma_pdf,
                download_tax_invoice_pdf,
            )

            db = SessionLocal()
            try:
                user = db.query(User).filter(User.full_name.ilike("%Prasanna%")).first()
                print("support_user_found", bool(user), "id", getattr(user, "id", None), "role", getattr(user, "role", None))
                targets = [
                    ("quotation", "CHN/QT/2627/0013", download_quotation_pdf),
                    ("proforma", "CHN/PI/26-27/0007", download_proforma_pdf),
                    ("invoice", "CHN/INV/26/0002", download_tax_invoice_pdf),
                ]
                for label, number, handler in targets:
                    print("=== target", label, number)
                    row = db.query(Quotation).filter(Quotation.doc_number == number).first()
                    print("row_found", bool(row), "id", getattr(row, "id", None), "doc_type", getattr(row, "doc_type", None))
                    try:
                        response = handler(doc_id=number, db=db, current_user=user)
                        print("result", getattr(response, "media_type", None), len(getattr(response, "body", b"")))
                    except Exception as exc:
                        print("EXC", type(exc).__name__, str(exc)[:500])
                        traceback.print_exc()
            finally:
                db.close()
            PY
              fi
            fi
            echo "=== done ==="
