name: Diagnose PDF generation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Install missing PDF dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check and install reportlab/pillow
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set +e
            PY=/opt/wacrm/backend/venv/bin/python
            PIP=/opt/wacrm/backend/venv/bin/pip
            echo "=== venv permissions ==="
            ls -ld /opt/wacrm/backend/venv /opt/wacrm/backend/venv/lib/python3.14/site-packages
            echo "=== before ==="
            "$PY" -c "import reportlab; print('reportlab', reportlab.Version)" 2>&1
            "$PY" -c "import PIL; print('pillow', PIL.__version__)" 2>&1
            echo "=== install ==="
            "$PIP" install --no-input 'reportlab>=4.0.0' 'pillow>=10.0.0' 2>&1 | tail -30
            echo "=== after ==="
            "$PY" -c "import reportlab, PIL; print('reportlab', reportlab.Version); print('pillow', PIL.__version__)" 2>&1
            echo "=== done ==="
