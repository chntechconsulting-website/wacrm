name: Deploy WaCRM to Bluehost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wacrm-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Bluehost VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -eu
            sudo /usr/local/sbin/wacrm-deploy
