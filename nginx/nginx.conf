# ==============================================================================
# WA! CRM - Nginx Reverse Proxy Configuration (Windows & Localhost Setup)
# ==============================================================================

worker_processes  1;

# Windows: explicit paths when running with custom -c config path
error_log  "C:/Users/CHN/Desktop/Wa CRM/nginx/logs/error.log";
pid        "C:/Users/CHN/Desktop/Wa CRM/nginx/logs/nginx.pid";

events {
    worker_connections  1024;
}

http {
    include       "C:/Users/CHN/Desktop/Wa CRM/nginx/mime.types";
    default_type  application/octet-stream;

    # Windows temp dirs (required when using custom -c config path)
    access_log             "C:/Users/CHN/Desktop/Wa CRM/nginx/logs/access.log";
    client_body_temp_path  "C:/Users/CHN/Desktop/Wa CRM/nginx/temp/client_body_temp";
    proxy_temp_path        "C:/Users/CHN/Desktop/Wa CRM/nginx/temp/proxy_temp";
    fastcgi_temp_path      "C:/Users/CHN/Desktop/Wa CRM/nginx/temp/fastcgi_temp";
    uwsgi_temp_path        "C:/Users/CHN/Desktop/Wa CRM/nginx/temp/uwsgi_temp";
    scgi_temp_path         "C:/Users/CHN/Desktop/Wa CRM/nginx/temp/scgi_temp";

    sendfile        on;
    keepalive_timeout  65;

    # File upload limit (covers Excel lead imports, call recordings, attachments)
    client_max_body_size 50M;

    # Gzip Compression for fast React single-page app asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Map for WebSocket Connection Header handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  localhost 127.0.0.1 www.wapluscrm.in wapluscrm.in;

        # ----------------------------------------------------------------------
        # 1. React Frontend (Serve prebuilt static assets from /frontend/dist)
        # ----------------------------------------------------------------------
        root "C:/Users/CHN/Desktop/Wa CRM/frontend/dist";
        index index.html;

        # React Router fallback: all non-file routes fall back to /index.html
        # This prevents 404 errors on browser page reloads (/dashboard, /leads, etc.)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Service Worker (sw.js) - must never be cached so updates propagate immediately
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # Dedicated Image Cache Location (30-day cache memory with stale-while-revalidate)
        location ~* \.(?:png|jpg|jpeg|svg|webp|gif|ico|avif)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
            access_log off;
            log_not_found off;
        }

        # Static assets cache optimization
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ----------------------------------------------------------------------
        # 2. FastAPI Backend API Reverse Proxy (/api -> http://127.0.0.1:8000/api)
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;

            # WebSocket and proxy headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for lead imports, reports, and IVR calls
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Disable proxy buffering for streaming/fast response delivery
            proxy_buffering off;
        }

        # Doocti direct integration proxy
        location /doocti/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 3. Static Uploads & Attachments (/uploads -> http://127.0.0.1:8000/uploads)
        # ----------------------------------------------------------------------
        location /uploads/ {
            proxy_pass http://127.0.0.1:8000/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # 4. WebSockets for Real-Time Call, WhatsApp, & Notification Sync
        # ----------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://127.0.0.1:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ----------------------------------------------------------------------
        # 5. FastAPI Interactive Documentation (/docs, /redoc, /openapi.json)
        # ----------------------------------------------------------------------
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Error pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
